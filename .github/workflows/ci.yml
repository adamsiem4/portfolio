name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check, build, and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up supported Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Review dependency vulnerabilities
        run: bun run audit:dependencies

      - name: Check source and public files
        run: bun run check

      - name: Run script unit tests
        run: bun test scripts

      - name: Build production site
        run: bun run build

      - name: Install browsers and system dependencies
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Run browser smoke suite
        id: browser_smoke
        run: bunx playwright test

      - name: Retain Playwright diagnostics
        if: failure() && steps.browser_smoke.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 14
