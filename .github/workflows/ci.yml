name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check, build, and Chromium smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check source and public files
        run: bun run check

      - name: Build production site
        run: bun run build

      - name: Install Chromium and system dependencies
        run: bunx playwright install --with-deps chromium

      - name: Run Chromium smoke suite
        id: chromium_smoke
        run: bunx playwright test --project=chromium

      - name: Retain Playwright diagnostics
        if: failure() && steps.chromium_smoke.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-chromium-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 14
