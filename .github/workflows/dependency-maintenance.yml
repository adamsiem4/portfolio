name: Dependency maintenance

on:
  schedule:
    - cron: '37 5 * * 3'
  workflow_dispatch:
  pull_request:
    paths:
      - package.json
      - bun.lock
      - .github/dependabot.yml
      - .github/workflows/**

permissions:
  contents: read

concurrency:
  group: dependency-maintenance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Audit, check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Review dependency vulnerabilities
        run: bun run audit:dependencies

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check source and public files
        run: bun run check

      - name: Build production site
        run: bun run build

  browser-matrix:
    name: Browser smoke (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: edge
            browser: msedge

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install matching browser and system dependencies
        run: bunx playwright install --with-deps ${{ matrix.browser }}

      - name: Build production site
        run: bun run build

      - name: Run browser smoke suite
        run: bunx playwright test --project=${{ matrix.project }}

      - name: Retain Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ matrix.project }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  bun-latest:
    name: Latest Bun compatibility
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up latest Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check with latest Bun
        run: bun run check

      - name: Build with latest Bun
        run: bun run build

      - name: Report Bun version drift
        shell: bash
        run: |
          pinned_version="$(bun -e "const pkg = await Bun.file('package.json').json(); process.stdout.write(pkg.packageManager.replace(/^bun@/, ''))")"
          latest_version="$(bun --version)"
          if [[ "$pinned_version" == "$latest_version" ]]; then
            echo "Pinned Bun $pinned_version is current." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Bun $latest_version passed compatibility checks; update the packageManager pin from $pinned_version after review."
            echo "Bun $latest_version is available; package.json remains pinned to $pinned_version pending review." >> "$GITHUB_STEP_SUMMARY"
          fi
